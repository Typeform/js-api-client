name: Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  build-lint-test:
    # Pinned on purpose: `ubuntu-latest` moves to the next Ubuntu LTS without any change in this repo.
    # To upgrade, change the label in every workflow in one PR, so this job validates the new image.
    # release.yml only runs on main and beta: watch the first Release run after merging, revert if it fails.
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        # node_major names the job, and must match the required check in the repo ruleset
        include:
          - node_version: 24.21.0 # end of life 2028-04-30
            node_major: 24
    name: build-lint-test - node ${{ matrix.node_major }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}

      - name: Get yarn cache
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: |
            **/node_modules
            ~/.cache
          key: ${{ runner.os }}-repo-${{ github.event.pull_request.head.repo.full_name }}-node-${{ matrix.node_version }}-yarn-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('.github/workflows/**.yml') }}

      - name: Install Node.js dependencies
        # run when cache not found or PR is external (build fails for external PRs if dependencies are not installed)
        if: steps.yarn-cache.outputs.cache-hit != 'true' || github.event.pull_request.head.repo.full_name != github.repository
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:unit

      - name: Integration tests
        run: (yarn server &) && sleep 1 && yarn test:integration

